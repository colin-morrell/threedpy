# socket_extension scoop test: one row of slot scoops, one row sharing a row scoop
storage_block:
    type: 'rowed'
    font_size: 6.0
    x: 2
    y: 3
    z: 3
    global:
        shape: 'socket_extension'
        drive: '1/4'
        orientation: 'horizontal'
rows:
    - slot_scoop: true
      slots:
        - {total_length: 50.7, label: '2"'}
        - {total_length: 50.7, label: '2"'}
    - row_scoop: true
      slots:
        - {total_length: 50.7, label: '2"'}
        - {total_length: 50.7, label: '2"'}
