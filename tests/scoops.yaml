# scoop test: one row of slot scoops (one with overridden dimensions), one row sharing a row scoop
storage_block:
    type: 'rowed'
    font_size: 6.0
    x: 3
    y: 3
    z: 3
    global:
        shape: 'cylinder'
        orientation: 'horizontal'
rows:
    - slot_scoop: true
      slots:
        - {diameter: 11.75, depth: 50.35, label: '6'}
        - {diameter: 13.15, depth: 50.65, label: '7', slot_scoop: {length: 15}}
        - {diameter: 13.75, depth: 51.10, label: '9'}
    - row_scoop: true
      slots:
        - {diameter: 11.75, depth: 50.35, label: '6'}
        - {diameter: 13.15, depth: 50.65, label: '7'}
        - {diameter: 13.75, depth: 51.10, label: '9'}
