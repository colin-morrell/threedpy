storage_block:
    # can specify the name of the output .stl here, otherwise will match input filename
    name: 'etorx'
    type: 'rowed'
    font_size: 6.0
    # gridfinity units
    x: 2
    y: 1
    z: 3
    # applies to every row/slot unless overwritten in that row/slot
    global:
        shape: 'round_vert'
        scale: 1.02
slots:
    - {diameter: 11.7, depth: 10, label: 'E4'}
    - {diameter: 11.7, depth: 10, label: 'E5'}
    - {diameter: 13.1, depth: 10, label: 'E6'}
    - {diameter: 13.1, depth: 10, label: 'E7'}
    - {diameter: 13.1, depth: 10, label: 'E8'}
